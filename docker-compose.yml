name: bidstream

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  LOG_LEVEL: info

services:
  # ---------- infrastructure ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bidstream
      POSTGRES_PASSWORD: bidstream
      POSTGRES_DB: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidstream -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 30

  redpanda-init:
    image: redpandadata/redpanda:v24.2.4
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    volumes:
      - ./infra/redpanda/create-topics.sh:/init/create-topics.sh:ro
    restart: "no"

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8088:8080"]
    depends_on:
      redpanda: { condition: service_healthy }

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"]

  # ---------- application ----------
  rfq-service:
    image: bidstream/rfq-service:local
    build: { context: ., dockerfile: services/rfq-service/Dockerfile }
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: rfq-service
      GRPC_PORT: "50061"
      DATABASE_URL: postgresql://bidstream:bidstream@postgres:5432/rfq
      KAFKA_BROKERS: redpanda:9092
      BID_SERVICE_ADDR: bid-service:50062
    depends_on: &app-deps
      postgres: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }

  bid-service:
    image: bidstream/bid-service:local
    build: { context: ., dockerfile: services/bid-service/Dockerfile }
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: bid-service
      GRPC_PORT: "50062"
      DATABASE_URL: postgresql://bidstream:bidstream@postgres:5432/bid
      KAFKA_BROKERS: redpanda:9092
    depends_on: *app-deps

  pricing-service:
    image: bidstream/pricing-service:local
    build: { context: ., dockerfile: services/pricing-service/Dockerfile }
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: pricing-service
      GRPC_PORT: "50063"
      DATABASE_URL: postgresql://bidstream:bidstream@postgres:5432/pricing
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      <<: *app-deps
      redis: { condition: service_healthy }

  edge-gateway:
    image: bidstream/edge-gateway:local
    build: { context: ., dockerfile: services/edge-gateway/Dockerfile }
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: edge-gateway
      HTTP_PORT: "8080"
      KAFKA_BROKERS: redpanda:9092
      RFQ_SERVICE_ADDR: rfq-service:50061
      BID_SERVICE_ADDR: bid-service:50062
      PRICING_SERVICE_ADDR: pricing-service:50063
      CORS_ORIGINS: http://localhost:5173,http://localhost:3080
    ports: ["8000:8080"]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }

  web:
    image: bidstream/web:local
    build: { context: ., dockerfile: web/Dockerfile }
    ports: ["3080:80"]
    depends_on: [edge-gateway]

volumes:
  pgdata:
