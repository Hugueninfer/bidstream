# L7 proxy for services that need request-level routing or policy. Only
# pricing-service opts in (canary routing + per-method authorization); the rest
# of the mesh stays on the cheaper L4 ztunnel path.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: bidstream
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
