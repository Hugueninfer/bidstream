# Ingress: Kubernetes Gateway API, implemented by Istio.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bidstream
  namespace: bidstream
  annotations:
    # kind has no cloud load balancer; scripts/k8s-up.sh pins the NodePort to 30080.
    networking.istio.io/service-type: NodePort
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bidstream
  namespace: bidstream
spec:
  parentRefs:
    - name: bidstream
  rules:
    # API and SSE go straight to the edge-gateway; everything else is the SPA.
    - matches:
        - path: { type: PathPrefix, value: /v1 }
        - path: { type: Exact, value: /openapi.json }
        - path: { type: Exact, value: /healthz }
        - path: { type: Exact, value: /readyz }
      backendRefs:
        - name: edge-gateway
          port: 8080
    - backendRefs:
        - name: web
          port: 80
