# Local 3-node cluster. The ingress gateway's NodePort 30080 is published on
# http://localhost:9080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bidstream
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 9080
        listenAddress: "127.0.0.1"
  - role: worker
  - role: worker
