apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app: redis }
spec:
  selector: { app: redis }
  ports:
    - name: tcp-redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      serviceAccountName: redis
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Pure cache: no persistence, evict least-recently-used keys when full.
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
