image:
  registry: bidstream
  tag: local
  # kind loads images straight into the nodes, so never pull them.
  pullPolicy: Never

# Shared by every service.
kafkaBrokers: redpanda:9092
otelEndpoint: http://jaeger-collector.istio-system:4318
# Share of requests traced. Tracing every request under load buries the
# in-memory Jaeger (CPU and swap on the host) and skews the measurements.
traceSampleRatio: "0.1"
databaseHost: postgres:5432
databaseSecret: postgres-credentials

defaults:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 384Mi }

services:
  edge-gateway:
    port: 8080
    protocol: http
    probes: { liveness: /healthz, readiness: /readyz }
    env:
      HTTP_PORT: "8080"
      RFQ_SERVICE_ADDR: rfq-service:50061
      BID_SERVICE_ADDR: bid-service:50062
      PRICING_SERVICE_ADDR: pricing-service:50063
      CORS_ORIGINS: http://localhost:9080

  rfq-service:
    port: 50061
    protocol: grpc
    database: rfq
    env:
      GRPC_PORT: "50061"
      BID_SERVICE_ADDR: bid-service:50062

  bid-service:
    port: 50062
    protocol: grpc
    database: bid
    env:
      GRPC_PORT: "50062"

  pricing-service:
    port: 50063
    protocol: grpc
    database: pricing
    # Route through the L7 waypoint (canary routing, per-method authorization).
    waypoint: waypoint
    # Stable and canary tracks; the mesh decides how traffic is split (see deploy/istio).
    versions:
      v1: { replicas: 2, env: { MODEL_VERSION: v1 } }
    env:
      GRPC_PORT: "50063"
      REDIS_URL: redis://redis:6379/0

  web:
    port: 80
    protocol: http
    replicas: 1
    kafka: false
    tracing: false
    hardened: false # nginx master runs as root to bind :80
    probes: { liveness: /, readiness: / }
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
