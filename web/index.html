<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BidStream: event-driven request-for-quote platform" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BidStream</title>
    <script>
      // Apply the colour scheme before first paint (OS preference unless the user chose one).
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("bs-theme"); } catch (e) {}
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
